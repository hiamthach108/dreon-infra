apiVersion: apps/v1
kind: Deployment
metadata:
  name: dreon-auth
  namespace: dreon-dev
  labels:
    app: dreon-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dreon-auth
  template:
    metadata:
      labels:
        app: dreon-auth
    spec:
      containers:
        - name: dreon-auth
          image: dreon-auth:local
          imagePullPolicy: Never  # k3d image import — no registry needed
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: dreon-auth-config
            - secretRef:
                name: dreon-auth-secret
          livenessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
