apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dreon-auth-ingress
  namespace: dreon-dev
  labels:
    app: dreon-auth
  annotations:
    # Kong Ingress Controller
    kubernetes.io/ingress.class: kong
    # Keep the full path — dreon-auth handles /api/v1/auth/* internally
    konghq.com/strip-path: "false"
spec:
  ingressClassName: kong
  rules:
    - host: api.dreon.local
      http:
        paths:
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: dreon-auth
                port:
                  number: 8080
