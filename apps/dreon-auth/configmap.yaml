apiVersion: v1
kind: ConfigMap
metadata:
  name: dreon-auth-config
  namespace: dreon-dev
  labels:
    app: dreon-auth
data:
  APP_NAME: "dreon-auth"
  APP_VERSION: "1.0.0"
  HTTP_HOST: "0.0.0.0"
  HTTP_PORT: "8080"
  GRPC_PORT: "9090"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"

  CACHE_DEFAULT_EXPIRE_TIME_SEC: "3600"
  CACHE_CLEANUP_INTERVAL_HOUR: "24"

  # PostgreSQL — points to the shared Postgres in dreon-system
  POSTGRES_HOST: "postgres-postgresql.dreon-system.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DBNAME: "dreon_auth"
  POSTGRES_SCHEMA: "public"
  POSTGRES_SSL: "false"
  POSTGRES_MAX_IDLE_CONNECTION: "5"
  POSTGRES_MAX_OPEN_CONNECTION: "50"
  POSTGRES_MAX_LIFE_TIME: "1800"
  POSTGRES_USERNAME: "postgres"

  # Redis — points to Redis master in dreon-system
  REDIS_HOST: "redis-master.dreon-system.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "0"

  # JWT token TTLs
  JWT_ACCESS_TOKEN_EXPIRES_IN: "3600"
  JWT_REFRESH_TOKEN_EXPIRES_IN: "86400"

  # Google OAuth — update with real values in secret or via env override
  GOOGLE_REDIRECT_URL: "http://api.dreon.local/api/v1/auth/google/callback"
