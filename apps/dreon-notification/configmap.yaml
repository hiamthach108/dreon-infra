apiVersion: v1
kind: ConfigMap
metadata:
  name: dreon-notification-config
  namespace: dreon-dev
  labels:
    app: dreon-notification
data:
  APP_NAME: "dreon-notification"
  APP_VERSION: "1.0.0"
  HTTP_HOST: "0.0.0.0"
  HTTP_PORT: "8080"
  GRPC_PORT: "9090"
  LOG_LEVEL: "info"

  CACHE_DEFAULT_EXPIRE_TIME_SEC: "3600"
  CACHE_CLEANUP_INTERVAL_HOUR: "24"

  # PostgreSQL
  POSTGRES_HOST: "postgres-postgresql.dreon-system.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DBNAME: "dreon_notification"
  POSTGRES_SSL: "false"
  POSTGRES_MAX_IDLE_CONNS: "5"
  POSTGRES_MAX_OPEN_CONNS: "50"
  POSTGRES_USERNAME: "postgres"

  # Redis
  REDIS_HOST: "redis-master.dreon-system.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "0"

  # RabbitMQ — password injected from secret at runtime
  RABBITMQ_HOST: "rabbitmq.dreon-system.svc.cluster.local"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USERNAME: "dreon"

  # Email / SMS templates (mounted from image)
  EMAIL_SENDER: "noreply@dreon.app"
  EMAIL_TEMPLATE_DIR: "templates/email"
  SMS_TEMPLATE_DIR: "templates/sms"

  # Firebase credentials are mounted from dreon-notification-firebase secret.
  FIREBASE_CREDENTIALS_PATH: "/etc/dreon-notification/firebase/firebase.json"
