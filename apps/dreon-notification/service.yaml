apiVersion: v1
kind: Service
metadata:
  name: dreon-notification
  namespace: dreon-dev
  labels:
    app: dreon-notification
spec:
  selector:
    app: dreon-notification
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 9090
      targetPort: 9090
