# dreon-auth Secret — EXAMPLE ONLY
# 1. Copy this file:  cp dreon-auth.secret.example.yaml dreon-auth.secret.yaml
# 2. Fill in real values (base64-encoded where noted)
# 3. NEVER commit dreon-auth.secret.yaml — it is gitignored
#
# To base64-encode a value:  echo -n 'your_value' | base64

apiVersion: v1
kind: Secret
metadata:
  name: dreon-auth-secret
  namespace: dreon-dev
  labels:
    app: dreon-auth
type: Opaque
stringData:
  # PostgreSQL password (must match platform/postgres/values.local.yaml)
  POSTGRES_PASSWORD: "dreon_local_pg_pass"

  # Redis password (must match platform/redis/values.local.yaml)
  REDIS_PASSWORD: "dreon_local_redis_pass"

  # RS256 keypair — generate with: make gen-keys
  # Paste the full PEM content here (multi-line supported via stringData)
  JWT_PRIVATE_KEY: |
    -----BEGIN RSA PRIVATE KEY----- # gitleaks:allow
    REPLACE_WITH_YOUR_PRIVATE_KEY
    -----END RSA PRIVATE KEY-----

  JWT_PUBLIC_KEY: |
    -----BEGIN PUBLIC KEY-----
    REPLACE_WITH_YOUR_PUBLIC_KEY
    -----END PUBLIC KEY-----

  # Google OAuth (optional for local — leave empty to disable)
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
