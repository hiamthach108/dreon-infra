# dreon-notification Secret — EXAMPLE ONLY
# 1. Copy: cp dreon-notification.secret.example.yaml dreon-notification.secret.yaml
# 2. Fill in real values
# 3. NEVER commit dreon-notification.secret.yaml

apiVersion: v1
kind: Secret
metadata:
  name: dreon-notification-secret
  namespace: dreon-dev
  labels:
    app: dreon-notification
type: Opaque
stringData:
  # PostgreSQL password (must match platform/postgres/values.local.yaml)
  POSTGRES_PASSWORD: "dreon_local_pg_pass"

  # Redis password (must match platform/redis/values.local.yaml)
  REDIS_PASSWORD: "dreon_local_redis_pass"

  # RabbitMQ full connection URL — password must match platform/rabbitmq/values.local.yaml
  RABBITMQ_URL: "amqp://dreon:dreon_local_rmq_pass@rabbitmq.dreon-system.svc.cluster.local:5672/"

  # Email (Resend) — leave empty locally to use mock client
  EMAIL_RESEND_API_KEY: ""

  # SMS (Twilio) — leave empty locally to use mock client
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""
  TWILIO_FROM_NUMBER: ""
