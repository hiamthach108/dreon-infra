apiVersion: k3d.io/v1alpha5
kind: Simple

metadata:
  name: dreon-local

# 1 control-plane + 2 worker nodes
servers: 1
agents: 2

# Map host :80 → k3d load-balancer → Kong NodePort 30080
# Map host :443 → k3d load-balancer → Kong NodePort 30443
ports:
  - port: 80:30080
    nodeFilters:
      - loadbalancer
  - port: 443:30443
    nodeFilters:
      - loadbalancer

options:
  k3s:
    extraArgs:
      # Disable Traefik — Kong will handle all ingress
      - arg: --disable=traefik
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
