# Bitnami Redis — local environment
# Standalone (no replica) to keep resource usage low locally.

architecture: standalone

auth:
  enabled: true
  password: "dreon_local_redis_pass"

master:
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
